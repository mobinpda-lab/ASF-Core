      - Arvin Build
      - Arvin Device Smoke
    security_gates:
      - exact_head
      - exact_base
      - independent_client_native_evidence
    artifact_requirements: []
    promotion_policy:
      enabled: true
      authorization: nira
      require_exact_head: true
      require_exact_base: true
    release_policy:
      enabled: true
      mode: client_native
      policy: factory/registry/client-release-policy.json
    worker_contract:
      adapter: nira-arvin
    lease_policy:
      ttl_seconds: 300
      heartbeat_seconds: 60
    retry_policy:
      max_attempts: 3
    recovery_policy:
      fail_closed: true
      bounded_attempts: 3
    evidence_retention:
      required: true
    completion_definition:
      - exact_head_verified
      - ci_verified
      - promotion_verified
      - release_verified
    last_verified_main_sha: a526e81c638b699a78c003073ef27b1346e49cd8

