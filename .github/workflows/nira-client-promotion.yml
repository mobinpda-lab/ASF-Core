name: NIRA Client Promotion

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Registered client repository owner/name'
        required: true
        type: string
      pr_number:
        description: 'Client PR number produced by NIRA'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact validated client PR head'
        required: true
        type: string
      control_issue_number:
        description: 'NIRA control issue that owns the lease/provenance'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nira-client-promotion-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical NIRA registry
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Mint scoped promotion token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIRA_GITHUB_APP_ID }}
          private-key: ${{ secrets.NIRA_GITHUB_APP_PRIVATE_KEY }}
          owner: mobinpda-lab
          repositories: NIRA,Arvin-clean,YadNegar,NetworkCenterMonitor
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Verify provenance, exact client gates and promote
        uses: actions/github-script@v7
        env:
          CLIENT_REPOSITORY: ${{ inputs.repository }}
          CLIENT_PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONTROL_ISSUE_NUMBER: ${{ inputs.control_issue_number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('factory/registry/client-validation-policy.json', 'utf8'));
            const repository = process.env.CLIENT_REPOSITORY;
            const expectedHead = process.env.EXPECTED_HEAD_SHA;
            const prNumber = Number(process.env.CLIENT_PR);
            const controlIssueNumber = Number(process.env.CONTROL_ISSUE_NUMBER);
            const config = policy.clients?.[repository];
            if (!config) throw new Error('NIRA_CLIENT_PROMOTION=UNREGISTERED_CLIENT');
            if (!/^[0-9a-f]{40}$/.test(expectedHead)) throw new Error('NIRA_CLIENT_PROMOTION=INVALID_HEAD');
            if (!Number.isInteger(prNumber) || prNumber <= 0 || !Number.isInteger(controlIssueNumber) || controlIssueNumber <= 0) {
              throw new Error('NIRA_CLIENT_PROMOTION=INVALID_INPUT');
            }
            const [clientOwner, clientRepo] = repository.split('/');

            const control = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: controlIssueNumber
            });
            const controlBody = String(control.data.body || '');
            if (!controlBody.includes('CLIENT_REPOSITORY: ' + repository)) {
              throw new Error('NIRA_CLIENT_PROMOTION=CONTROL_ISSUE_REPOSITORY_MISMATCH');
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: controlIssueNumber, per_page: 100
            });

            let pr = await github.rest.pulls.get({
              owner: clientOwner, repo: clientRepo, pull_number: prNumber
            });
            if (pr.data.state !== 'open') throw new Error('NIRA_CLIENT_PROMOTION=PR_NOT_OPEN');
            if (pr.data.base.ref !== 'main') throw new Error('NIRA_CLIENT_PROMOTION=BASE_NOT_MAIN');
            if (pr.data.head.repo?.full_name !== repository) throw new Error('NIRA_CLIENT_PROMOTION=FORK_HEAD_REJECTED');
            if (!String(pr.data.head.ref || '').startsWith('nira/')) throw new Error('NIRA_CLIENT_PROMOTION=HEAD_NAMESPACE_REJECTED');
            if (pr.data.head.sha !== expectedHead) throw new Error('NIRA_CLIENT_PROMOTION=HEAD_DRIFT');

            const leaseId = String(pr.data.body || '').match(/Lease:\s*([^\s]+)/i)?.[1] || '';
            const leasedMain = String(pr.data.body || '').match(/Exact leased main SHA:\s*([0-9a-f]{40})/i)?.[1] || '';
            if (!leaseId || !leasedMain) throw new Error('NIRA_CLIENT_PROMOTION=MISSING_PR_PROVENANCE');
            const leaseEvidence = comments.find(c =>
              c.body?.includes('NIRA_LEASE=ACQUIRED') &&
              c.body?.includes('LEASE_ID=' + leaseId) &&
              c.body?.includes('CLIENT_REPOSITORY=' + repository) &&
              c.body?.includes('EXPECTED_CLIENT_MAIN_SHA=' + leasedMain)
            );
            if (!leaseEvidence) throw new Error('NIRA_CLIENT_PROMOTION=LEASE_PROVENANCE_NOT_OBSERVED');

            const currentMainRef = await github.rest.git.getRef({
              owner: clientOwner, repo: clientRepo, ref: 'heads/main'
            });
            const currentMain = currentMainRef.data.object.sha;
            if (pr.data.base.sha !== currentMain || leasedMain !== currentMain) {
              throw new Error(
                'NIRA_CLIENT_PROMOTION=BASE_DRIFT current=' + currentMain +
                ' pr_base=' + pr.data.base.sha + ' leased=' + leasedMain
              );
            }

            const required = [...(config.fast || []), ...(config.heavy || [])];
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: clientOwner, repo: clientRepo, head_sha: expectedHead, per_page: 100
            });
            const evidence = [];
            for (const gate of required) {
              const run = runs
                .filter(r => r.name === gate.name && r.head_sha === expectedHead)
                .sort((a,b) => b.id - a.id)[0];
              evidence.push({
                name: gate.name,
                run_id: run?.id || null,
                status: run?.status || 'missing',
                conclusion: run?.conclusion || null,
                head_sha: run?.head_sha || null
              });
              if (!run || run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== expectedHead) {
                throw new Error('NIRA_CLIENT_PROMOTION=GATE_NOT_VERIFIED:' + gate.name);
              }
            }

            const lockedMain = await github.rest.git.getRef({
              owner: clientOwner, repo: clientRepo, ref: 'heads/main'
            });
            if (lockedMain.data.object.sha !== currentMain) {
              throw new Error('NIRA_CLIENT_PROMOTION=MAIN_MOVED_DURING_VALIDATION');
            }
            pr = await github.rest.pulls.get({
              owner: clientOwner, repo: clientRepo, pull_number: prNumber
            });
            if (pr.data.head.sha !== expectedHead || pr.data.state !== 'open') {
              throw new Error('NIRA_CLIENT_PROMOTION=PR_CHANGED_DURING_VALIDATION');
            }
            if (pr.data.draft) {
              await github.graphql(
                'mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { number isDraft } } }',
                {id: pr.data.node_id}
              );
              pr = await github.rest.pulls.get({
                owner: clientOwner, repo: clientRepo, pull_number: prNumber
              });
              if (pr.data.draft) throw new Error('NIRA_CLIENT_PROMOTION=READY_CONVERSION_FAILED');
            }
            if (pr.data.mergeable !== true) throw new Error('NIRA_CLIENT_PROMOTION=NOT_MERGEABLE');

            const merge = await github.rest.pulls.merge({
              owner: clientOwner,
              repo: clientRepo,
              pull_number: prNumber,
              merge_method: 'squash',
              sha: expectedHead,
              commit_title: 'promote(nira): client PR #' + prNumber,
              commit_message: 'NIRA client promotion: exact leased main, exact validated head, client-native fast/heavy gates, independent provenance.'
            });
            if (!merge.data.merged) throw new Error('NIRA_CLIENT_PROMOTION=MERGE_REJECTED:' + merge.data.message);
            const mergedMain = await github.rest.git.getRef({
              owner: clientOwner, repo: clientRepo, ref: 'heads/main'
            });
            if (mergedMain.data.object.sha !== merge.data.sha || mergedMain.data.object.sha === currentMain) {
              throw new Error('NIRA_CLIENT_PROMOTION=POSTCONDITION_MAIN_MISMATCH');
            }

            const promotionEvidence = {
              schema_version: '1.0',
              authority: 'NIRA Client Promotion',
              repository,
              control_issue_number: controlIssueNumber,
              pr_number: prNumber,
              lease_id: leaseId,
              leased_main_sha: leasedMain,
              validated_head_sha: expectedHead,
              pre_merge_main_sha: currentMain,
              post_merge_main_sha: mergedMain.data.object.sha,
              gates: evidence,
              observation_state: 'VERIFIED',
              confidence: 'HIGH',
              observed_at: new Date().toISOString()
            };
            fs.writeFileSync(
              'nira-client-promotion-evidence.json',
              JSON.stringify(promotionEvidence, null, 2) + '\n'
            );

            const completionBody = [
              '<!-- nira-client-promotion-v1 -->',
              'NIRA_CLIENT_PROMOTION=VERIFIED',
              'CLIENT_REPOSITORY=' + repository,
              'CLIENT_PR=' + prNumber,
              'VALIDATED_HEAD=' + expectedHead,
              'PRE_MERGE_MAIN=' + currentMain,
              'POST_MERGE_MAIN=' + mergedMain.data.object.sha,
              'LEASE_ID=' + leaseId,
              'GATES=' + evidence.map(x => x.name + ':' + x.run_id).join(',')
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: controlIssueNumber, body: completionBody
            }).catch(error => core.warning('Completion comment failed after verified merge: ' + error.message));
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: controlIssueNumber,
              labels: ['factory:completed']
            }).catch(error => core.warning('Optional completion label unavailable: ' + error.message));
            core.notice(
              'NIRA_CLIENT_PROMOTION=VERIFIED repo=' + repository +
              ' pr=' + prNumber + ' main=' + mergedMain.data.object.sha
            );

      - name: Upload cross-repository promotion evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nira-client-promotion-${{ inputs.pr_number }}-${{ inputs.expected_head_sha }}
          path: nira-client-promotion-evidence.json
          if-no-files-found: error

      - name: Wake NIRA scheduler after client promotion
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nira-queue-scheduler.yml',
              ref: 'main'
            });
