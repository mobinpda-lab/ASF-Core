name: NIRA Intake Queue

on:
  issues:
    types: [opened, labeled, unlabeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number for explicit non-recursive intake wake'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nira-intake-queue-${{ github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile issue into durable GitHub queue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let issue = context.payload.issue;
            if (!issue && context.eventName === 'workflow_dispatch') {
              const raw = String(context.payload.inputs?.issue_number || '');
              if (!/^\d+$/.test(raw)) {
                core.info('Manual invocation without issue_number; no queue mutation performed.');
                return;
              }
              const fetched = await github.rest.issues.get({
                owner, repo, issue_number: Number(raw)
              });
              issue = fetched.data;
            }
            if (!issue) {
              core.info('No issue resolved; no queue mutation performed.');
              return;
            }
            const fresh = await github.rest.issues.get({
              owner, repo, issue_number: issue.number
            });
            issue = fresh.data;
            const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            if (!labels.includes('factory:ready')) {
              core.info('Issue is not factory:ready; no intake performed.');
              return;
            }
            const marker = '<!-- nira-intake-v1 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100
            });
            const alreadyIntaken = comments.some(c => c.body && c.body.includes(marker));
            if (alreadyIntaken) {
              const activeOrTerminal = [
                'factory:queued',
                'factory:leased',
                'factory:in-progress',
                'factory:completed',
                'factory:blocked',
                'factory:escalated'
              ].some(label => labels.includes(label));
              if (activeOrTerminal) {
                core.info(`Already intaken with active/terminal state: #${issue.number}`);
                return;
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number,
                labels: ['factory:queued']
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  '<!-- nira-intake-reactivation-v1 -->',
                  'NIRA_INTAKE=REACTIVATED',
                  'NIRA_QUEUE=GITHUB_ISSUE',
                  'ISSUE=' + issue.number,
                  'REASON=READY_WITHOUT_ACTIVE_OR_TERMINAL_STATE',
                  'SHA=' + context.sha
                ].join('\n')
              });
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'nira-queue-scheduler.yml',
                ref: 'main'
              });
              core.notice('NIRA_SCHEDULER_WAKE=REACTIVATED issue=' + issue.number);
              return;
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number,
              labels: ['factory:queued']
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `${marker}\nNIRA_INTAKE=ACCEPTED\nNIRA_QUEUE=GITHUB_ISSUE\nISSUE=${issue.number}\nSHA=${context.sha}`
            });
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'nira-queue-scheduler.yml',
              ref: 'main'
            });
            core.notice('NIRA_SCHEDULER_WAKE=REQUESTED issue=' + issue.number);
