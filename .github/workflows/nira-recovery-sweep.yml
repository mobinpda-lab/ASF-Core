name: NIRA Recovery Sweep

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nira-recovery-sweep
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Detect stale queued/leased work
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();
            const ttlMs = 5 * 60 * 1000;
            const marker = '<!-- nira-lease-v1 -->';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'factory:leased', per_page: 100
            });
            for (const issue of issues) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const leases = comments.filter(c => c.body && c.body.includes(marker));
              const latest = leases.sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (!latest) continue;
              if (now - new Date(latest.created_at).getTime() <= ttlMs) continue;
              const recoveryMarker = `<!-- nira-recovery-v1:${issue.number}:${latest.id} -->`;
              if (comments.some(c => c.body && c.body.includes(recoveryMarker))) continue;
              await github.rest.issues.removeLabel({owner, repo, issue_number: issue.number, name: 'factory:leased'}).catch(() => {});
              await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: ['factory:queued']});
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `${recoveryMarker}\nNIRA_RECOVERY=STALE_LEASE\nACTION=REQUEUE\nLEASE_COMMENT=${latest.id}\nOBSERVED_AT=${new Date().toISOString()}`
              });
            }
