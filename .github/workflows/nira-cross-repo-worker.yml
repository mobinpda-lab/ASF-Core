name: NIRA Cross-Repository Worker

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Registered client repository (owner/name)'
        required: true
        type: string
      issue_number:
        description: 'Client issue number'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact client main SHA leased by NIRA'
        required: true
        type: string
      worker_id:
        description: 'Unique NIRA worker identity'
        required: true
        type: string
      lease_id:
        description: 'NIRA lease identifier'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nira-worker-${{ inputs.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed when cross-repository credential is unavailable
        shell: bash
        env:
          CROSS_REPO_TOKEN: ${{ secrets.NIRA_CROSS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CROSS_REPO_TOKEN" || {
            echo 'NIRA_BLOCKED=MISSING_CROSS_REPO_CREDENTIAL'
            echo 'NIRA_REQUIREMENT=least-privilege GitHub credential/App installation'
            exit 1
          }

      - name: Validate worker identity and lease inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ inputs.worker_id }}'
          test -n '${{ inputs.lease_id }}'
          test '${{ inputs.issue_number }}' -gt 0
          echo "NIRA_WORKER_ID=${{ inputs.worker_id }}"
          echo "NIRA_LEASE_ID=${{ inputs.lease_id }}"

      - name: Validate exact client HEAD before execution
        uses: actions/github-script@v7
        env:
          CROSS_REPO_TOKEN: ${{ secrets.NIRA_CROSS_REPO_TOKEN }}
          CLIENT_REPOSITORY: ${{ inputs.repository }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        with:
          github-token: ${{ secrets.NIRA_CROSS_REPO_TOKEN }}
          script: |
            const [owner, repo] = process.env.CLIENT_REPOSITORY.split('/');
            if (!owner || !repo) throw new Error('INVALID_CLIENT_REPOSITORY');
            const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const observed = ref.data.object.sha;
            if (observed !== process.env.EXPECTED_MAIN_SHA) {
              core.setFailed(`NIRA_FENCING=HEAD_DRIFT expected=${process.env.EXPECTED_MAIN_SHA} observed=${observed}`);
              return;
            }
            core.notice(`NIRA_FENCING=EXACT_HEAD_CONFIRMED sha=${observed}`);

      - name: Record execution boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'NIRA_EXECUTION_BOUNDARY=AUTHORIZED'
            echo 'NIRA_WORKER_RUNTIME=REAL_GITHUB_ACTIONS'
            echo "NIRA_CLIENT_REPOSITORY=${{ inputs.repository }}"
            echo "NIRA_ISSUE=${{ inputs.issue_number }}"
            echo "NIRA_EXPECTED_MAIN_SHA=${{ inputs.expected_main_sha }}"
            echo "NIRA_WORKER_ID=${{ inputs.worker_id }}"
            echo "NIRA_LEASE_ID=${{ inputs.lease_id }}"
          } | tee nira-worker-evidence.txt

      - name: Upload execution boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nira-worker-boundary-${{ inputs.issue_number }}
          path: nira-worker-evidence.txt
          if-no-files-found: error
