name: validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schemas
        run: python -m unittest discover -s tests/contract-tests -p '*_test.py'
      - name: Validate integration foundation
        run: python -m unittest discover -s tests/integration-tests -p '*_test.py'
