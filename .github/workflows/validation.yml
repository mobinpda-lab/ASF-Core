name: validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schemas
        run: python -m unittest tests.contract-tests.schema_contract_test
      - name: Validate contracts and adapter boundary
        run: python -m unittest tests.contract-tests.adapter_boundary_test
      - name: Validate integration foundation
        run: python -m unittest tests.integration-tests.foundation_integration_test
