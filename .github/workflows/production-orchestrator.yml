name: NIRA Production Orchestrator

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]
  workflow_run:
    workflows: ['NIRA CI', 'NIRA Factory E2E', 'NIRA Factory Conformance', 'NIRA Security Gate']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pull-requests: write
  actions: write
  issues: read

concurrency:
  group: nira-production-promotion
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  POLICY: factory/registry/promotion-policy.json
  NIRA_INSTALLATION_ID: '153019703'

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIRA_GITHUB_APP_ID }}
          private-key: ${{ secrets.NIRA_GITHUB_APP_PRIVATE_KEY }}
          owner: mobinpda-lab
          repositories: NIRA,Arvin-clean,YadNegar,NetworkCenterMonitor

      - name: Discover and promote registry-authorized candidates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$REPO"
          policy="$POLICY"
          test -f "$policy" || { echo "BLOCK registry policy missing"; exit 1; }

          enabled=$(jq -r '.promotion.enabled' "$policy")
          required_label=$(jq -r '.promotion.required_label' "$policy")
          head_prefix=$(jq -r '.promotion.head_branch_prefix' "$policy")
          max_candidates=$(jq -r '.promotion.max_candidates_per_cycle' "$policy")
          auto_ready=$(jq -r '.promotion.auto_ready_when_all_gates_pass // false' "$policy")
          mapfile -t required_workflows < <(jq -r '.promotion.required_workflows[]? // empty' "$policy")
          if [[ "${#required_workflows[@]}" -eq 0 ]]; then
            legacy_required_workflow=$(jq -r '.promotion.required_workflow // empty' "$policy")
            [[ -n "$legacy_required_workflow" ]] && required_workflows=("$legacy_required_workflow")
          fi
          [[ "$enabled" == "true" ]] || { echo "PROMOTION_DISABLED"; exit 0; }
          [[ "${#required_workflows[@]}" -gt 0 ]] || { echo "BLOCK invalid registry policy: no required workflows"; exit 1; }
          [[ "$required_label" != "null" && "$head_prefix" != "null" ]] || { echo "BLOCK invalid registry policy"; exit 1; }

          prs=$(gh api --paginate "repos/$repo/pulls?state=open&base=main&per_page=100" | jq -s 'add')
          candidates=$(jq -c --arg label "$required_label" --arg prefix "$head_prefix" '[.[] | select(.mergeable != false and (.labels | map(.name) | index($label))) | select(.head.ref | startswith($prefix))] | sort_by(.number)' <<<"$prs")
          count=$(jq 'length' <<<"$candidates")
          echo "DISCOVERY candidates=$count label=$required_label prefix=$head_prefix"
          [[ "$count" -le "$max_candidates" ]] || { echo "BLOCK candidate overflow count=$count max=$max_candidates"; exit 1; }
          [[ "$count" != "0" ]] || { echo "NO_AUTHORIZED_CANDIDATE"; exit 0; }

          while IFS= read -r row; do
            pr=$(jq -r '.number' <<<"$row")
            head=$(jq -r '.head.sha' <<<"$row")
            base_sha=$(jq -r '.base.sha' <<<"$row")
            draft=$(jq -r '.draft' <<<"$row")
            current_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$base_sha" == "$current_main" ]] || { echo "BLOCK PR#$pr BASE_DRIFT base=$base_sha main=$current_main"; continue; }

            runs=$(gh run list --repo "$repo" --commit "$head" --json databaseId,status,conclusion,workflowName,headSha --limit 100)
            all_green=true
            for wf in "${required_workflows[@]}"; do
              run_id=$(jq -r --arg sha "$head" --arg wf "$wf" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success" and .workflowName == $wf)][0].databaseId // empty' <<<"$runs")
              if [[ -z "$run_id" ]]; then
                echo "BLOCK PR#$pr no exact-head successful workflow=$wf"
                all_green=false
                continue
              fi
              artifact=$(jq -r --arg wf "$wf" '.promotion.required_artifacts[$wf] // (if .promotion.required_workflow == $wf then .promotion.required_artifact else empty end) // empty' "$policy")
              if [[ -n "$artifact" ]]; then
                artifact_json=$(gh api "repos/$repo/actions/runs/$run_id/artifacts")
                artifact_count=$(jq --arg artifact "$artifact" '[.artifacts[] | select(.name == $artifact and .expired == false)] | length' <<<"$artifact_json")
                if [[ "$artifact_count" -eq 0 ]]; then
                  echo "BLOCK PR#$pr workflow=$wf run=$run_id missing artifact=$artifact"
                  all_green=false
                fi
              fi
            done
            [[ "$all_green" == "true" ]] || continue

            pr_now=$(gh api "repos/$repo/pulls/$pr")
            [[ "$(jq -r '.state' <<<"$pr_now")" == "open" ]] || { echo "BLOCK PR#$pr state changed"; continue; }
            [[ "$(jq -r '.merged' <<<"$pr_now")" == "false" ]] || { echo "BLOCK PR#$pr already merged"; continue; }
            [[ "$(jq -r '.head.sha' <<<"$pr_now")" == "$head" ]] || { echo "BLOCK PR#$pr HEAD_DRIFT during validation"; continue; }

            pre_merge_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$pre_merge_main" == "$current_main" ]] || { echo "BLOCK PR#$pr MAIN_MOVED_BEFORE_MERGE old=$current_main new=$pre_merge_main"; continue; }

            if [[ "$draft" == "true" ]]; then
              if [[ "$auto_ready" == "true" ]]; then
                gh api --method POST "repos/$repo/pulls/$pr/ready_for_review" >/dev/null
                pr_now=$(gh api "repos/$repo/pulls/$pr")
                [[ "$(jq -r '.draft' <<<"$pr_now")" == "false" ]] || { echo "BLOCK PR#$pr ready conversion not confirmed"; continue; }
              else
                continue
              fi
            fi

            [[ "$(jq -r '.mergeable' <<<"$pr_now")" != "false" ]] || { echo "BLOCK PR#$pr not mergeable"; continue; }
            payload=$(jq -n --arg sha "$head" --arg title "promote(nira): PR#$pr registry-authorized promotion" --arg message "NIRA registry-authorized promotion: exact HEAD/base, complete CI/E2E/conformance/security evidence, fail-closed validation." '{sha:$sha,merge_method:"squash",commit_title:$title,commit_message:$message}')
            response=$(curl --fail-with-body -sS -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" "https://api.github.com/repos/$repo/pulls/$pr/merge" -d "$payload")
            [[ "$(jq -r '.merged // false' <<<"$response")" == "true" ]] || { echo "BLOCK PR#$pr merge API did not confirm merged=true"; continue; }

            merged_json=$(gh api "repos/$repo/pulls/$pr")
            [[ "$(jq -r '.merged' <<<"$merged_json")" == "true" ]] || { echo "BLOCK PR#$pr post-merge confirmation failed"; exit 1; }
            merge_commit=$(jq -r '.merge_commit_sha' <<<"$merged_json")
            [[ -n "$merge_commit" && "$merge_commit" != "null" ]] || { echo "BLOCK PR#$pr missing merge_commit_sha"; exit 1; }
            new_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$new_main" == "$merge_commit" ]] || { echo "BLOCK PR#$pr main postcondition mismatch main=$new_main merge_commit=$merge_commit"; exit 1; }
            [[ "$new_main" != "$current_main" ]] || { echo "BLOCK PR#$pr main unchanged"; exit 1; }

            gh workflow run production-orchestrator.yml --repo "$repo" --ref main
          done < <(jq -c '.[]' <<<"$candidates")
