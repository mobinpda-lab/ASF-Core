name: ASF-Core Production Orchestrator

on:
  workflow_dispatch:
  push:
    branches: ['factory/independent-control-plane-hardening-20260904', 'factory/github-app-runtime-20260904', 'factory/github-app-key-normalization-20260904', 'main']
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read

concurrency:
  group: asf-core-production-promotion
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  POLICY: factory/registry/promotion-policy.json
  ASF_INSTALLATION_ID: '153019703'

jobs:
  promote:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/factory/independent-control-plane-hardening-20260904' || github.ref == 'refs/heads/factory/github-app-runtime-20260904' || github.ref == 'refs/heads/factory/github-app-key-normalization-20260904'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Normalize GitHub App private key
        id: normalized-key
        env:
          ASF_MOC_APP_PRIVATE_KEY_RAW: ${{ secrets.ASF_MOC_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key="$ASF_MOC_APP_PRIVATE_KEY_RAW"
          # Accept both a real multiline PEM and a single-line value containing literal \\n          # escape sequences. Never print the key or its contents.
          key="${key//\\n/$'\\n'}"
          if [[ "$key" != *"-----BEGIN "*"PRIVATE KEY-----"* ]] || [[ "$key" != *"-----END "*"PRIVATE KEY-----"* ]]; then
            echo "BLOCK GitHub App private key is not a recognizable PEM private-key value"
            exit 1
          fi
          printf 'private-key<<ASF_MOC_KEY_EOF\n%s\nASF_MOC_KEY_EOF\n' "$key" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ASF_MOC_APP_ID }}
          private-key: ${{ steps.normalized-key.outputs.private-key }}
          owner: mobinpda-lab
          repositories: ASF-Core,Arvin-clean,YadNegar,NetworkCenterMonitor

      - name: Discover and promote registry-authorized candidates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$REPO"
          policy="$POLICY"
          test -f "$policy" || { echo "BLOCK registry policy missing"; exit 1; }

          enabled=$(jq -r '.promotion.enabled' "$policy")
          required_label=$(jq -r '.promotion.required_label' "$policy")
          head_prefix=$(jq -r '.promotion.head_branch_prefix' "$policy")
          required_workflow=$(jq -r '.promotion.required_workflow' "$policy")
          required_artifact=$(jq -r '.promotion.required_artifact' "$policy")
          max_candidates=$(jq -r '.promotion.max_candidates_per_cycle' "$policy")
          [[ "$enabled" == "true" ]] || { echo "PROMOTION_DISABLED"; exit 0; }
          [[ "$required_label" != "null" && "$head_prefix" != "null" && "$required_workflow" != "null" && "$required_artifact" != "null" ]] || { echo "BLOCK invalid registry policy"; exit 1; }

          prs=$(gh api --paginate "repos/$repo/pulls?state=open&base=main&per_page=100" | jq -s 'add')
          candidates=$(jq -c --arg label "$required_label" --arg prefix "$head_prefix" '[.[] | select(.draft == false and .mergeable != false and (.labels | map(.name) | index($label))) | select(.head.ref | startswith($prefix))] | sort_by(.number)' <<<"$prs")
          count=$(jq 'length' <<<"$candidates")
          echo "DISCOVERY candidates=$count label=$required_label prefix=$head_prefix"
          [[ "$count" -le "$max_candidates" ]] || { echo "BLOCK candidate overflow count=$count max=$max_candidates"; exit 1; }
          [[ "$count" != "0" ]] || { echo "NO_AUTHORIZED_CANDIDATE"; exit 0; }

          while IFS= read -r row; do
            pr=$(jq -r '.number' <<<"$row")
            head=$(jq -r '.head.sha' <<<"$row")
            base_sha=$(jq -r '.base.sha' <<<"$row")
            current_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$base_sha" == "$current_main" ]] || { echo "BLOCK PR#$pr BASE_DRIFT base=$base_sha main=$current_main"; exit 1; }

            runs=$(gh run list --repo "$repo" --commit "$head" --json databaseId,status,conclusion,workflowName,headSha --limit 50)
            run_id=$(jq -r --arg sha "$head" --arg wf "$required_workflow" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success" and .workflowName == $wf)][0].databaseId // empty' <<<"$runs")
            [[ -n "$run_id" ]] || { echo "BLOCK PR#$pr no exact-head successful workflow=$required_workflow"; exit 1; }

            artifact_json=$(gh api "repos/$repo/actions/runs/$run_id/artifacts")
            artifact_count=$(jq --arg artifact "$required_artifact" '[.artifacts[] | select(.name == $artifact and .expired == false)] | length' <<<"$artifact_json")
            [[ "$artifact_count" -gt 0 ]] || { echo "BLOCK PR#$pr run=$run_id missing artifact=$required_artifact"; exit 1; }

            pr_now=$(gh api "repos/$repo/pulls/$pr")
            [[ "$(jq -r '.state' <<<"$pr_now")" == "open" ]] || { echo "BLOCK PR#$pr state changed"; exit 1; }
            [[ "$(jq -r '.merged' <<<"$pr_now")" == "false" ]] || { echo "BLOCK PR#$pr already merged"; exit 1; }
            [[ "$(jq -r '.head.sha' <<<"$pr_now")" == "$head" ]] || { echo "BLOCK PR#$pr HEAD_DRIFT during validation"; exit 1; }

            echo "READY PR#$pr head=$head base=$base_sha run=$run_id artifact=$required_artifact main=$current_main"
            payload=$(jq -n --arg sha "$head" --arg title "promote(asf-core): PR#$pr registry-authorized promotion" --arg message "ASF-MOC v9.0 registry-authorized promotion: exact HEAD/base, authentic CI, artifact evidence, fail-closed validation." '{sha:$sha,merge_method:"squash",commit_title:$title,commit_message:$message}')
            response=$(curl --fail-with-body -sS -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" "https://api.github.com/repos/$repo/pulls/$pr/merge" -d "$payload")
            [[ "$(jq -r '.merged // false' <<<"$response")" == "true" ]] || { echo "BLOCK PR#$pr merge API did not confirm merged=true"; exit 1; }

            merged_json=$(gh api "repos/$repo/pulls/$pr")
            [[ "$(jq -r '.merged' <<<"$merged_json")" == "true" ]] || { echo "BLOCK PR#$pr post-merge confirmation failed"; exit 1; }
            merge_commit=$(jq -r '.merge_commit_sha' <<<"$merged_json")
            [[ -n "$merge_commit" && "$merge_commit" != "null" ]] || { echo "BLOCK PR#$pr missing merge_commit_sha"; exit 1; }
            new_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$new_main" == "$merge_commit" ]] || { echo "BLOCK PR#$pr main postcondition mismatch main=$new_main merge_commit=$merge_commit"; exit 1; }
            [[ "$new_main" != "$current_main" ]] || { echo "BLOCK PR#$pr main unchanged"; exit 1; }
            echo "PROMOTED PR#$pr merge_commit=$merge_commit new_main=$new_main"
          done < <(jq -c '.[]' <<<"$candidates")
