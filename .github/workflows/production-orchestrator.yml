name: ASF-Core Production Orchestrator

on:
  workflow_dispatch:
  push:
    branches: ['factory/central-production-orchestrator-20260904']
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: write

concurrency:
  group: asf-core-production-promotion
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  BOOTSTRAP_PR: '12'
  BOOTSTRAP_HEAD_SHA: 'af9ad00dcfdbde70f5ec0c244c0e4c5b5062569f'
  BOOTSTRAP_BASE_SHA: '9afbad7264b84619bb307d34e19eb2c0bb6d0398'
  BOOTSTRAP_ARTIFACT: 'asf-core-test-results'

jobs:
  promote:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/factory/central-production-orchestrator-20260904'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate and promote
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$REPO"

          if [[ "$GITHUB_REF" == "refs/heads/factory/central-production-orchestrator-20260904" ]]; then
            pr="$BOOTSTRAP_PR"
            json=$(gh api "repos/$repo/pulls/$pr")
            state=$(jq -r '.state' <<<"$json")
            merged=$(jq -r '.merged' <<<"$json")
            draft=$(jq -r '.draft' <<<"$json")
            head=$(jq -r '.head.sha' <<<"$json")
            base_sha=$(jq -r '.base.sha' <<<"$json")
            mergeable=$(jq -r '.mergeable' <<<"$json")

            [[ "$state" == "open" ]] || { echo "BLOCK bootstrap PR#$pr state=$state"; exit 1; }
            [[ "$merged" == "false" ]] || { echo "BLOCK bootstrap PR#$pr already merged"; exit 1; }
            [[ "$draft" == "false" ]] || { echo "BLOCK bootstrap PR#$pr draft=true"; exit 1; }
            [[ "$head" == "$BOOTSTRAP_HEAD_SHA" ]] || { echo "BLOCK bootstrap PR#$pr HEAD_DRIFT head=$head expected=$BOOTSTRAP_HEAD_SHA"; exit 1; }
            [[ "$base_sha" == "$BOOTSTRAP_BASE_SHA" ]] || { echo "BLOCK bootstrap PR#$pr BASE_DRIFT base=$base_sha expected=$BOOTSTRAP_BASE_SHA"; exit 1; }
            [[ "$mergeable" != "false" ]] || { echo "BLOCK bootstrap PR#$pr mergeable=false"; exit 1; }

            runs=$(gh run list --repo "$repo" --commit "$head" --json databaseId,status,conclusion,workflowName,headSha --limit 20)
            run_id=$(jq -r --arg sha "$head" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success" and .workflowName == "ASF-Core CI")][0].databaseId // empty' <<<"$runs")
            [[ -n "$run_id" ]] || { echo "BLOCK bootstrap PR#$pr no exact-head successful ASF-Core CI"; exit 1; }

            artifact_count=$(gh api "repos/$repo/actions/runs/$run_id/artifacts" --jq --arg artifact "$BOOTSTRAP_ARTIFACT" '[.artifacts[] | select(.name == $artifact and .expired == false)] | length')
            [[ "$artifact_count" -gt 0 ]] || { echo "BLOCK bootstrap PR#$pr run=$run_id missing artifact=$BOOTSTRAP_ARTIFACT"; exit 1; }

            current_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$current_main" == "$BOOTSTRAP_BASE_SHA" ]] || { echo "BLOCK bootstrap main HEAD_DRIFT main=$current_main expected=$BOOTSTRAP_BASE_SHA"; exit 1; }
            echo "BOOTSTRAP_READY PR#$pr head=$head base=$base_sha run=$run_id artifact=$BOOTSTRAP_ARTIFACT main=$current_main"

            gh pr merge "$pr" --repo "$repo" --squash --delete-branch=false --subject "promote(asf-core): PR#12 governed bootstrap" --body "ASF-MOC v9.0 Production Orchestrator: PR#12 explicitly authorized as architectural bootstrap target; exact-head, exact-base, authentic CI artifact, and fail-closed validation."

            merged_json=$(gh api "repos/$repo/pulls/$pr")
            merged=$(jq -r '.merged' <<<"$merged_json")
            merge_commit=$(jq -r '.merge_commit_sha' <<<"$merged_json")
            [[ "$merged" == "true" ]] || { echo "BLOCK bootstrap PR#$pr merge not confirmed"; exit 1; }
            [[ -n "$merge_commit" && "$merge_commit" != "null" ]] || { echo "BLOCK bootstrap PR#$pr missing merge_commit_sha"; exit 1; }

            new_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$new_main" == "$merge_commit" ]] || { echo "BLOCK bootstrap main postcondition mismatch main=$new_main merge_commit=$merge_commit"; exit 1; }
            [[ "$new_main" != "$current_main" ]] || { echo "BLOCK bootstrap main unchanged"; exit 1; }
            echo "BOOTSTRAP_PROMOTED PR#$pr merge_commit=$merge_commit new_main=$new_main"
            exit 0
          fi

          declare -A HEADS
          HEADS[3]='943966fd19e1ee95a9e4c37d1f6cb6d44839e070'
          HEADS[5]='f0199d28fc758e8e2627cfc5ad8ffb1a62113dc4'
          HEADS[4]='8cb62b33d4c367bf4ba6e9d102d2043212f6462c'
          HEADS[8]='fa5d9528e5c0647617d7ddd3c1c6bbe533b19e2b'

          for pr in 3 5 4 8; do
            json=$(gh api "repos/$repo/pulls/$pr")
            state=$(jq -r '.state' <<<"$json")
            merged=$(jq -r '.merged' <<<"$json")
            draft=$(jq -r '.draft' <<<"$json")
            head=$(jq -r '.head.sha' <<<"$json")
            mergeable=$(jq -r '.mergeable' <<<"$json")

            [[ "$state" == "open" ]] || { echo "BLOCK PR#$pr state=$state"; exit 1; }
            [[ "$merged" == "false" ]] || { echo "BLOCK PR#$pr already merged"; exit 1; }
            [[ "$draft" == "false" ]] || { echo "BLOCK PR#$pr draft=true"; exit 1; }
            [[ "$head" == "${HEADS[$pr]}" ]] || { echo "BLOCK PR#$pr stale head=$head expected=${HEADS[$pr]}"; exit 1; }
            [[ "$mergeable" != "false" ]] || { echo "BLOCK PR#$pr mergeable=false"; exit 1; }

            runs=$(gh run list --repo "$repo" --commit "$head" --json databaseId,status,conclusion,workflowName,headSha --limit 20)
            run_id=$(jq -r --arg sha "$head" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success" and .workflowName == "ASF-Core CI")][0].databaseId // empty' <<<"$runs")
            [[ -n "$run_id" ]] || { echo "BLOCK PR#$pr no exact-head successful ASF-Core CI run"; exit 1; }
            artifact_count=$(gh api "repos/$repo/actions/runs/$run_id/artifacts" --jq --arg artifact "$BOOTSTRAP_ARTIFACT" '[.artifacts[] | select(.name == $artifact and .expired == false)] | length')
            [[ "$artifact_count" -gt 0 ]] || { echo "BLOCK PR#$pr exact run=$run_id has no test artifact"; exit 1; }

            current_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            echo "READY PR#$pr head=$head run=$run_id main=$current_main"
            gh pr merge "$pr" --repo "$repo" --squash --delete-branch=false --subject "promote(asf-core): PR#$pr governed squash promotion" --body "ASF-MOC v9.0 Production Orchestrator: exact-head, authentic CI, artifact evidence, serial promotion."
            new_main=$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
            [[ "$new_main" != "$current_main" ]] || { echo "BLOCK PR#$pr main unchanged"; exit 1; }
            echo "PROMOTED PR#$pr new_main=$new_main"
          done
