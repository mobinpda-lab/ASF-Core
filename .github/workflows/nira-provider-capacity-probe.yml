name: NIRA Provider Capacity Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nira-provider-capacity-probe
  cancel-in-progress: true

env:
  OPENAI_MODEL: gpt-5.6

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe provider only when self-completion is capacity-blocked
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const apiKey = process.env.OPENAI_API_KEY || '';
            if (!apiKey) {
              core.notice('NIRA_PROVIDER_PROBE=SKIP_KEY_MISSING');
              return;
            }

            const rows = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const candidates = [];
            for (const issue of rows.filter(x => !x.pull_request)) {
              const labels = new Set((issue.labels || []).map(x => typeof x === 'string' ? x : x.name));
              if (!labels.has('factory:blocked')) continue;
              if (!String(issue.body || '').includes('NIRA_SELF_COMPLETION_TASK: true')) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const capacityEvents = comments
                .filter(c => /NIRA_PROVIDER_CAPACITY=(EXHAUSTED|RESTORED)/.test(String(c.body || '')))
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
              if (!capacityEvents.length) continue;
              if (!String(capacityEvents[0].body || '').includes('NIRA_PROVIDER_CAPACITY=EXHAUSTED')) continue;
              candidates.push({ issue, comments });
            }

            if (!candidates.length) {
              core.notice('NIRA_PROVIDER_PROBE=NO_BLOCKED_SELF_WORK');
              return;
            }

            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: process.env.OPENAI_MODEL,
                input: 'Return exactly OK.',
                max_output_tokens: 4
              })
            });

            if (!response.ok) {
              const detail = await response.text();
              const exhausted = response.status === 429 &&
                /no credits remaining|insufficient[_ -]?quota|billing|quota exhausted|credit_balance_exhausted/i.test(detail);
              if (exhausted) {
                core.notice('NIRA_PROVIDER_PROBE=STILL_EXHAUSTED');
                return;
              }
              core.warning('NIRA_PROVIDER_PROBE=TRANSIENT status=' + response.status);
              return;
            }

            for (const { issue, comments } of candidates) {
              const marker = '<!-- nira-provider-capacity-restored-v1 -->';
              if (!comments.some(c => String(c.body || '').includes(marker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: [
                    marker,
                    'NIRA_PROVIDER_CAPACITY=RESTORED',
                    'PROBE_RUN=' + context.runId,
                    'ACTION=UNBLOCK_AND_REQUEUE_SELF_COMPLETION',
                    'PRODUCT_FAILURE_CLAIMED=false'
                  ].join('\n')
                });
              }
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'factory:blocked'
              }).catch(() => {});
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['factory:queued']
              });
              core.notice('NIRA_PROVIDER_CAPACITY=RESTORED issue=' + issue.number);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'nira-queue-scheduler.yml', ref: 'main'
            });
