name: NIRA Provider Capacity Probe

on:
  issues:
    types: [labeled]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nira-provider-capacity-probe
  cancel-in-progress: true

env:
  NIRA_PROVIDER_ORDER: ${{ vars.NIRA_PROVIDER_ORDER || 'gemini,openrouter,openai' }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
  OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout provider router
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Probe providers only when self-completion is capacity-blocked
        uses: actions/github-script@v7
        env:
          NIRA_PROVIDER_ORDER: ${{ env.NIRA_PROVIDER_ORDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ env.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const { routedResponse, configuredProviderNames } = require(
              process.cwd() + '/factory/runtime/provider_router.js'
            );
            const providers = configuredProviderNames(process.env);
            if (!providers.length) {
              core.notice('NIRA_PROVIDER_PROBE=SKIP_NO_PROVIDER_CONFIGURED');
              return;
            }

            const rows = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const candidates = [];
            for (const issue of rows.filter(row => !row.pull_request)) {
              const labels = new Set((issue.labels || []).map(label => typeof label === 'string' ? label : label.name));
              if (!labels.has('factory:blocked')) continue;
              if (!String(issue.body || '').includes('NIRA_SELF_COMPLETION_TASK: true')) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              const capacityEvents = comments
                .filter(comment => /NIRA_PROVIDER_CAPACITY=(EXHAUSTED|RESTORED)/.test(String(comment.body || '')))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              if (!capacityEvents.length) continue;
              if (!String(capacityEvents[0].body || '').includes('NIRA_PROVIDER_CAPACITY=EXHAUSTED')) continue;
              candidates.push({ issue, comments });
            }

            if (!candidates.length) {
              core.notice('NIRA_PROVIDER_PROBE=NO_BLOCKED_SELF_WORK');
              return;
            }

            let probe;
            try {
              probe = await routedResponse(
                [{ role: 'user', content: [{ type: 'input_text', text: 'Return exactly OK.' }] }],
                { env: process.env, core, maxOutputTokens: 8, expectJson: false }
              );
            } catch (error) {
              const meta = error.niraProviderMeta || {};
              if (meta.exhausted) {
                core.notice('NIRA_PROVIDER_PROBE=STILL_EXHAUSTED');
              } else if (meta.pressure) {
                core.notice('NIRA_PROVIDER_PROBE=TRANSIENT_PRESSURE');
              } else {
                core.warning('NIRA_PROVIDER_PROBE=NO_HEALTHY_PROVIDER');
              }
              return;
            }

            for (const { issue, comments } of candidates) {
              const marker = '<!-- nira-provider-capacity-restored-v1 -->';
              const latestRestored = comments
                .filter(comment => String(comment.body || '').includes(marker))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              const currentExhausted = comments
                .filter(comment => String(comment.body || '').includes('NIRA_PROVIDER_CAPACITY=EXHAUSTED'))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (!latestRestored || new Date(latestRestored.created_at) < new Date(currentExhausted.created_at)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: [
                    marker,
                    'NIRA_PROVIDER_CAPACITY=RESTORED',
                    'PROVIDER=' + probe.provider,
                    'MODEL=' + (probe.model || ''),
                    'PROBE_RUN=' + context.runId,
                    'ACTION=UNBLOCK_AND_REQUEUE_SELF_COMPLETION',
                    'PRODUCT_FAILURE_CLAIMED=false'
                  ].join('\n')
                });
              }
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: 'factory:blocked'
              }).catch(() => {});
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['factory:queued']
              });
              core.notice('NIRA_PROVIDER_CAPACITY=RESTORED issue=' + issue.number + ' provider=' + probe.provider);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'nira-queue-scheduler.yml', ref: 'main'
            });
