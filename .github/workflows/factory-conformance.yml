name: NIRA Factory Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run actions/setup-python@v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run NIRA factory contract tests
        run: python -m pytest -q factory/tests

      - name: Fail closed on missing canonical NIRA surfaces
        shell: bash
        run: |
          set -euo pipefail
          required=(
            NIRA_IDENTITY.json
            docs/history/NIRA_IDENTITY_HISTORY.md
            factory/contracts/schema.py
            factory/runtime/state_machine.py
            factory/gates/engine.py
            factory/recovery/policy.py
            factory/feedback/provider_pressure.py
            factory/scheduling/policy.py
            .github/workflows/nira-queue-scheduler.yml
            .github/workflows/nira-failure-feedback.yml
            .github/workflows/nira-main-closure.yml
            .github/workflows/nira-factory-pulse.yml
            factory/adapters/generic.py
            factory/registry/projects.example.yaml
            factory/registry/promotion-policy.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "MISSING_NIRA_CANONICAL_SURFACE=$path"; exit 1; }
          done
          jq -e '.schema_version == "1.1" and .canonical_name == "NIRA" and .repository_name == "NIRA" and .single_factory_authority == true and .historical_identifiers_may_be_active_authority == false' NIRA_IDENTITY.json >/dev/null
          jq -e '.schema_version == "1.1" and .promotion.enabled == true and (.promotion.max_candidates_per_cycle >= 1) and (.promotion.required_workflows | length >= 4)' factory/registry/promotion-policy.json >/dev/null
          grep -q 'L10' README.md || {
            echo 'NIRA L10 status must remain explicit until authentic E2E evidence exists'; exit 1;
          }

      - name: Audit active source tree for legacy factory identity
        shell: bash
        run: |
          set -euo pipefail
          history='docs/history/NIRA_IDENTITY_HISTORY.md'
          test -f "$history"

          mapfile -t legacy < <(sed -n 's/^- `\([^`]*\)` — .*/\1/p' "$history")
          ((${#legacy[@]} > 0)) || { echo 'NIRA_LEGACY_IDENTIFIER_LIST_EMPTY'; exit 1; }

          : > nira-naming-audit.txt
          for pattern in "${legacy[@]}"; do
            while IFS= read -r match; do
              file="${match%%:*}"
              [[ "$file" == "$history" ]] && continue
              printf '%s\n' "$match" >> nira-naming-audit.txt
            done < <(git grep -n -F -- "$pattern" -- ':!docs/history/NIRA_IDENTITY_HISTORY.md' || true)
          done

          if [[ -s nira-naming-audit.txt ]]; then
            echo 'LEGACY_IDENTITY_FOUND'
            cat nira-naming-audit.txt
            exit 1
          fi
          printf 'LEGACY_IDENTITY_FOUND=0\n' > nira-naming-audit.txt
          echo 'LEGACY_IDENTITY_FOUND=0'

      - name: Reject legacy identity in active branch name
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          lowered="$(printf '%s' "$ref" | tr '[:upper:]' '[:lower:]')"
          history='docs/history/NIRA_IDENTITY_HISTORY.md'
          mapfile -t legacy < <(sed -n 's/^- `\\([^`]*\\)` — .*/\\1/p' "$history")
          for pattern in "${legacy[@]}"; do
            needle="$(printf '%s' "$pattern" | tr '[:upper:]' '[:lower:]')"
            [[ -n "$needle" ]] || continue
            if [[ "$lowered" == *"$needle"* ]]; then
              echo "LEGACY_BRANCH_IDENTITY_FOUND=$ref"
              exit 1
            fi
          done
          echo "LEGACY_BRANCH_IDENTITY_FOUND=0"

      - name: Upload naming audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: nira-naming-audit
          path: nira-naming-audit.txt
