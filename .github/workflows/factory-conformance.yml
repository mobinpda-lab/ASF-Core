name: NIRA Factory Conformance

on:
  push:
    branches: [main, 'nira/**']
    paths:
      - '**'
  pull_request:
    branches: [main]
    paths:
      - '**'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run NIRA factory contract tests
        run: python -m pytest -q factory/tests
      - name: Fail closed on missing canonical NIRA surfaces
        shell: bash
        run: |
          set -euo pipefail
          required=(
            NIRA_IDENTITY.json
            docs/history/NIRA_IDENTITY_HISTORY.md
            factory/contracts/schema.py
            factory/runtime/state_machine.py
            factory/gates/engine.py
            factory/recovery/policy.py
            factory/adapters/generic.py
            factory/registry/projects.example.yaml
            factory/registry/promotion-policy.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "MISSING_NIRA_CANONICAL_SURFACE=$path"; exit 1; }
          done
          jq -e '.schema_version == "1.1" and .canonical_name == "NIRA" and .repository_name == "NIRA" and .single_factory_authority == true and .historical_identifiers_may_be_active_authority == false' NIRA_IDENTITY.json >/dev/null
          jq -e '.schema_version == "1.0" and .promotion.enabled == true and (.promotion.max_candidates_per_cycle >= 1)' factory/registry/promotion-policy.json >/dev/null
          grep -q 'L10' README.md || {
            echo 'NIRA L10 status must remain explicit until authentic E2E evidence exists'; exit 1;
          }
      - name: Audit every active source surface for legacy factory identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          history = Path('docs/history/NIRA_IDENTITY_HISTORY.md')
          if not history.is_file():
              raise SystemExit('NIRA_IDENTITY_HISTORY_MISSING')

          # Derive the forbidden legacy identifiers from the single historical record.
          # The gate itself therefore does not need to embed those identifiers.
          text = history.read_text(encoding='utf-8')
          legacy = []
          for line in text.splitlines():
              if line.startswith('- `') and '` — ' in line:
                  value = line[3:line.index('`', 3)]
                  if value:
                      legacy.append(value)
          legacy.extend(x.lower() for x in legacy)

          findings = []
          for path in sorted(p for p in Path('.').rglob('*') if p.is_file()):
              relative = path.as_posix()
              if relative == history.as_posix() or relative.startswith('.git/'):
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for lineno, line in enumerate(content.splitlines(), 1):
                  for pattern in legacy:
                      if pattern in line:
                          findings.append(f'{relative}:{lineno}:{pattern}')
          if findings:
              Path('nira-naming-audit.txt').write_text('\n'.join(findings) + '\n', encoding='utf-8')
              print('LEGACY_IDENTITY_FOUND')
              print('\n'.join(findings))
              raise SystemExit(1)
          Path('nira-naming-audit.txt').write_text('LEGACY_IDENTITY_FOUND=0\n', encoding='utf-8')
          print('LEGACY_IDENTITY_FOUND=0')
          PY
      - name: Upload naming audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nira-naming-audit
          path: nira-naming-audit.txt
          if-no-files-found: error
