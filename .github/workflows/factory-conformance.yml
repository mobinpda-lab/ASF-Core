name: NIRA Factory Conformance

on:
  push:
    branches: [main, 'nira/**']
    paths:
      - 'factory/**'
      - 'docs/architecture/**'
      - '.github/workflows/factory-conformance.yml'
      - '.github/workflows/production-orchestrator.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'factory/**'
      - 'docs/architecture/**'
      - '.github/workflows/factory-conformance.yml'
      - '.github/workflows/production-orchestrator.yml'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run factory contract tests
        run: python -m pytest -q factory/tests
      - name: Fail closed on missing canonical surfaces
        shell: bash
        run: |
          set -euo pipefail
          required=(
            factory/contracts/schema.py
            factory/runtime/state_machine.py
            factory/gates/engine.py
            factory/recovery/policy.py
            factory/adapters/generic.py
            factory/registry/projects.example.yaml
            factory/registry/promotion-policy.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "MISSING_CANONICAL_SURFACE=$path"; exit 1; }
          done
          jq -e '.schema_version == "1.0" and .promotion.enabled == true and (.promotion.max_candidates_per_cycle >= 1)' factory/registry/promotion-policy.json >/dev/null
          grep -q 'L10' README.md || {
            echo 'L10 status must remain explicit until authentic E2E evidence exists'; exit 1;
          }
      - name: Audit legacy factory branding
        id: naming_audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          legacy = [
              ''.join(chr(x) for x in (65,83,70,95,77,79,67)),
              ''.join(chr(x) for x in (65,83,70,45,77,79,67)),
              ''.join(chr(x) for x in (65,83,70,95,70,65,67,84,79,82,89)),
              ''.join(chr(x) for x in (65,83,70,95,67,79,82,69)),
              ''.join(chr(x) for x in (65,83,70,32,77,79,67)),
              ''.join(chr(x) for x in (65,83,70,45,67,111,114,101,32,67,73)),
              ''.join(chr(x) for x in (97,115,102,45,99,111,114,101,45,116,101,115,116,45,114,101,115,117,108,116,115)),
              ''.join(chr(x) for x in (97,115,102,45,97,117,116,104,111,114,105,122,101,100)),
          ]
          allowed_provider_slug = 'mobinpda-lab/ASF-Core'
          audit_path = Path('.nira-naming-audit.txt')
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          matches = []
          for name in files:
              if not name or name == '.github/workflows/factory-conformance.yml':
                  continue
              try:
                  text = Path(name).read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  normalized = line.replace(allowed_provider_slug, '<provider-slug>')
                  for pattern in legacy:
                      if pattern in normalized:
                          matches.append(f'{name}:{lineno}: {pattern}')
          if matches:
              audit_path.write_text('NIRA_NAMING_GATE=FAIL\n' + '\n'.join(matches) + '\n', encoding='utf-8')
              print(audit_path.read_text(encoding='utf-8'), end='')
              raise SystemExit(1)
          audit_path.write_text('NIRA_NAMING_GATE=PASS\nNo legacy factory identifiers found in active tracked text files.\n', encoding='utf-8')
          print(audit_path.read_text(encoding='utf-8'), end='')
          PY
      - name: Upload naming audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nira-naming-audit
          path: .nira-naming-audit.txt
          if-no-files-found: error
