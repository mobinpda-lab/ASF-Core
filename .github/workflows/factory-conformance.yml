name: ASF-Core Factory Conformance

on:
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - 'docs/architecture/**'
      - '.github/workflows/factory-conformance.yml'
  pull_request:
    paths:
      - 'factory/**'
      - 'docs/architecture/**'
      - '.github/workflows/factory-conformance.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run factory contract tests
        run: python -m pytest -q factory/tests
      - name: Fail closed on missing canonical surfaces
        shell: bash
        run: |
          set -euo pipefail
          required=(
            factory/contracts/schema.py
            factory/runtime/state_machine.py
            factory/gates/engine.py
            factory/recovery/policy.py
            factory/adapters/generic.py
            factory/registry/projects.example.yaml
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "MISSING_CANONICAL_SURFACE=$path"; exit 1; }
          done
          grep -q 'L10 remains `UNVERIFIED`' README.md || {
            echo 'L10 status must remain explicit until authentic E2E evidence exists'; exit 1;
          }
