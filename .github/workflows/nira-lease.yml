name: NIRA Lease

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nira-lease-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  lease:
    if: github.event.label.name == 'factory:queued' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Acquire GitHub-authoritative lease
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100
            });
            const activeLease = comments.some(c => c.body && c.body.includes('<!-- nira-lease-v1 -->') && !c.body.includes('NIRA_LEASE=EXPIRED'));
            if (activeLease) {
              core.info(`Existing lease marker found for #${issue.number}; refusing duplicate lease.`);
              return;
            }
            await github.rest.issues.removeLabel({owner, repo, issue_number: issue.number, name: 'factory:queued'}).catch(() => {});
            await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: ['factory:leased']});
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `<!-- nira-lease-v1 -->\nNIRA_LEASE=ACQUIRED\nISSUE=${issue.number}\nWORKER_IDENTITY=${context.actor}\nLEASE_RUN_ID=${context.runId}\nLEASE_SHA=${context.sha}\nLEASE_TTL_SECONDS=300\nHEARTBEAT_SECONDS=60`
            });
            core.notice(`LEASE_ACQUIRED issue=${issue.number} worker_identity=${context.actor} run=${context.runId}`);
