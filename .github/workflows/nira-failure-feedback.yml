name: NIRA Failure Feedback

on:
  workflow_run:
    workflows: ['NIRA CI', 'NIRA Factory E2E', 'NIRA Factory Conformance', 'NIRA Security Gate']
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: nira-failure-feedback-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Convert actionable exact-head failures into bounded NIRA repair tasks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const conclusion = run?.conclusion || 'unknown';
            if (conclusion === 'success' || conclusion === 'cancelled') {
              core.info('Non-actionable conclusion=' + conclusion + '; no repair task.');
              return;
            }
            if (!['failure', 'timed_out'].includes(conclusion)) {
              core.info('Conclusion=' + conclusion + ' is outside bounded auto-fix policy.');
              return;
            }
            const headSha = String(run?.head_sha || '');
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('NIRA_FEEDBACK_BLOCKED=MISSING_EXACT_HEAD');
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100
            });
            const pr = pulls.find(x => x.head?.sha === headSha);
            if (!pr) {
              core.info('No open NIRA PR owns failed exact head ' + headSha + '; no task created.');
              return;
            }
            if (!String(pr.head?.ref || '').startsWith('nira/')) {
              core.info('PR #' + pr.number + ' is outside NIRA-owned branch namespace; no auto-fix.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const unsafe = files.some(f =>
              f.filename.startsWith('.github/workflows/') ||
              f.filename === 'factory/registry/promotion-policy.json' ||
              /secret|credential|token/i.test(f.filename)
            );

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const failedSteps = [];
            for (const job of jobs) {
              for (const step of (job.steps || [])) {
                if (step.conclusion === 'failure' || step.conclusion === 'timed_out') {
                  failedSteps.push(job.name + ' :: ' + step.name);
                }
              }
            }
            const signal = (run.name + ' ' + failedSteps.join(' ')).toLowerCase();
            let failureClass = 'UNKNOWN';
            let ownerLane = 'ESCALATE';
            let retryable = false;
            let classAutoRepair = false;
            if (/permission|credential|token|github app|private key|forbidden|security/.test(signal)) {
              failureClass = 'PERMISSION';
              ownerLane = 'CREDENTIAL_OR_SECURITY';
            } else if (/setup|install|runner|sdk|network|service|environment/.test(signal)) {
              failureClass = 'ENVIRONMENT';
              ownerLane = 'ENVIRONMENT_RECOVERY';
              retryable = true;
            } else if (/test|pytest|assert|regression|golden|snapshot/.test(signal)) {
              failureClass = 'TEST_REGRESSION';
              ownerLane = 'BOUNDED_REPAIR';
              retryable = true;
              classAutoRepair = true;
            } else if (/compile|build|syntax|type|lint|analy|contract/.test(signal)) {
              failureClass = 'CODE';
              ownerLane = 'BOUNDED_REPAIR';
              retryable = true;
              classAutoRepair = true;
            } else if (conclusion === 'timed_out') {
              failureClass = 'FLAKY';
              ownerLane = 'REVALIDATE';
              retryable = true;
            }

            let previousAttempt = 0;
            const sourceIssueMatch = String(pr.body || '').match(/Issue:\s*#(\d+)/i);
            if (sourceIssueMatch) {
              try {
                const source = await github.rest.issues.get({
                  owner, repo, issue_number: Number(sourceIssueMatch[1])
                });
                previousAttempt = Number(
                  String(source.data.body || '').match(/NIRA_AUTO_FIX_ATTEMPT:\s*(\d+)/i)?.[1] || '0'
                );
              } catch (error) {
                core.warning('Could not resolve source issue for attempt accounting: ' + error.message);
              }
            }
            const nextAttempt = previousAttempt + 1;
            const autoFixAllowed = classAutoRepair && !unsafe && nextAttempt <= 2;

            const title = '[AUTO-FIX] ' + run.name + ' failed at ' + headSha.slice(0, 12);
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const duplicate = existing.find(i => !i.pull_request && i.title === title);
            if (duplicate) {
              core.info('Duplicate feedback already exists as #' + duplicate.number);
              return;
            }

            const created = await github.rest.issues.create({
              owner, repo, title,
              body: [
                '<!-- nira-auto-fix-v1 -->',
                'Automated exact-head failure feedback owned by NIRA.',
                '',
                'SOURCE_PR: ' + pr.number,
                'SOURCE_WORKFLOW: ' + run.name,
                'SOURCE_RUN_URL: ' + String(run.html_url || ''),
                'SOURCE_HEAD_SHA: ' + headSha,
                'SOURCE_CONCLUSION: ' + conclusion,
                'NIRA_FEEDBACK_CLASS: ' + failureClass,
                'NIRA_FEEDBACK_CONFIDENCE: ' + (failureClass === 'UNKNOWN' ? 'NONE' : 'MEDIUM'),
                'NIRA_FEEDBACK_OWNER_LANE: ' + ownerLane,
                'NIRA_FEEDBACK_RETRYABLE: ' + String(retryable),
                'FAILED_STEPS: ' + failedSteps.join(' | '),
                'NIRA_AUTO_FIX_ATTEMPT: ' + nextAttempt,
                'AUTO_FIX_ELIGIBLE: ' + String(autoFixAllowed),
                '',
                'CLIENT_REPOSITORY: mobinpda-lab/NIRA',
                'CLIENT_ISSUE: PLACEHOLDER',
                '',
                'Fix only the failed NIRA-owned source/docs surface. Do not change workflows, secrets, permissions, promotion policy, release controls, or product-client logic.'
              ].join('\n')
            });
            const issueNumber = created.data.number;
            const body = String(created.data.body || '').replace(
              'CLIENT_ISSUE: PLACEHOLDER',
              'CLIENT_ISSUE: ' + issueNumber
            );
            await github.rest.issues.update({owner, repo, issue_number: issueNumber, body});

            if (!autoFixAllowed) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: unsafe
                  ? 'NIRA_FEEDBACK=ESCALATE_UNSAFE_SCOPE\nNIRA_FEEDBACK_CLASS=' + failureClass
                  : (!classAutoRepair
                      ? 'NIRA_FEEDBACK=ROUTE_' + ownerLane + '\nNIRA_FEEDBACK_CLASS=' + failureClass
                      : 'NIRA_FEEDBACK=ESCALATE_AUTO_FIX_BUDGET_EXHAUSTED\nNIRA_FEEDBACK_CLASS=' + failureClass)
              });
              core.notice('NIRA_FEEDBACK=ESCALATED issue=' + issueNumber);
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issueNumber, labels: ['factory:ready']
            });
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'nira-intake-queue.yml',
              ref: 'main',
              inputs: { issue_number: String(issueNumber) }
            });
            core.notice('NIRA_FEEDBACK=AUTO_FIX_QUEUED issue=' + issueNumber + ' attempt=' + nextAttempt);
