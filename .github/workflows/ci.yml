name: ASF-Core CI

on:
  push:
    branches: [main, 'factory/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Discover and run available tests
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ -d tests/unit-tests ] || [ -d tests/integration-tests ]; then
            python -m pytest tests/unit-tests tests/integration-tests -v --junitxml=test-results.xml
          elif [ -d tests ]; then
            python -m pytest tests -v --junitxml=test-results.xml
          else
            echo 'No tests directory present; CI configuration is invalid for this commit.' >&2
            exit 1
          fi
      - name: Upload authentic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asf-core-test-results
          path: test-results.xml
          if-no-files-found: error
