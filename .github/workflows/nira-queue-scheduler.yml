name: NIRA Queue Scheduler

on:
  issues:
    types: [labeled, unlabeled, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: nira-queue-scheduler
  cancel-in-progress: false

env:
  NIRA_AI_PROVIDER_AVAILABLE: ${{ secrets.OPENAI_API_KEY != '' }}

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prioritize capacity and dispatch canonical leases
        uses: actions/github-script@v7
        env:
          AI_PROVIDER_AVAILABLE: ${{ env.NIRA_AI_PROVIDER_AVAILABLE }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const blocked = new Set([
              'do-not-merge', 'factory:blocked', 'factory:escalated',
              'orchestrator:hold', 'orchestrator:manual'
            ]);
            const priority = labels => {
              const order = [
                'priority:release-blocker',
                'priority:core',
                'priority:automation',
                'priority:feature'
              ];
              for (let i = 0; i < order.length; i++) if (labels.has(order[i])) return i;
              return 4;
            };
            const laneFor = issue =>
              /NIRA_EXECUTION_MODE:\s*deterministic-doc-append/i.test(issue.body || '')
                ? 'DETERMINISTIC' : 'AI';
            const labelsFor = issue => new Set(
              (issue.labels || []).map(x => typeof x === 'string' ? x : x.name)
            );
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const work = issues.filter(x => !x.pull_request);
            const active = work.filter(issue => {
              const labels = labelsFor(issue);
              return labels.has('factory:leased') || labels.has('factory:in-progress');
            });
            const activeAi = active.filter(x => laneFor(x) === 'AI').length;
            const activeDeterministic = active.filter(x => laneFor(x) === 'DETERMINISTIC').length;
            const queuedAiIssues = work.filter(x =>
              labelsFor(x).has('factory:queued') && laneFor(x) === 'AI'
            );
            let providerPressure = 0;
            let providerCapacityExhausted = false;
            let repeatedFailures = 0;
            let successfulSignals = 0;
            let failedSignals = 0;
            for (const issue of work) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              if (comments.some(c => c.body?.includes('NIRA_PROVIDER_PRESSURE=TRANSIENT'))) providerPressure += 1;
              if (comments.some(c => c.body?.includes('NIRA_PROVIDER_CAPACITY=EXHAUSTED'))) providerCapacityExhausted = true;
              if (comments.filter(c => c.body?.includes('NIRA_FEEDBACK_CLASS=')).length >= 2) repeatedFailures += 1;
              if (comments.some(c => c.body?.includes('NIRA_CLIENT_PROMOTION=VERIFIED') || c.body?.includes('NIRA_LEASE=HANDED_TO_PR'))) successfulSignals += 1;
              if (comments.some(c => c.body?.includes('NIRA_FEEDBACK=ESCALATED') || c.body?.includes('NIRA_WORKER=FAILED_NON_PROVIDER'))) failedSignals += 1;
            }
            const totalSignals = successfulSignals + failedSignals;
            const successRate = totalSignals > 0 ? successfulSignals / totalSignals : 1.0;
            let maxAi = 1;
            let capacityReason = 'HOLD';
            if (providerCapacityExhausted) {
              maxAi = 0;
              capacityReason = 'PROVIDER_CAPACITY_EXHAUSTED';
            } else if (providerPressure > 0) {
              maxAi = 1;
              capacityReason = 'PROVIDER_PRESSURE';
            } else if (repeatedFailures >= 2 || successRate < 0.70) {
              maxAi = 1;
              capacityReason = 'QUALITY_DEGRADED';
            } else if (queuedAiIssues.length >= 6 && successRate >= 0.90) {
              maxAi = 4;
              capacityReason = 'HEALTHY_BACKLOG_HIGH';
            } else if (queuedAiIssues.length >= 3 && successRate >= 0.90) {
              maxAi = 2;
              capacityReason = 'HEALTHY_BACKLOG';
            }
            const activeAiRepos = new Set(
              active.filter(x => laneFor(x) === 'AI')
                .map(x => String(x.body || '').match(/CLIENT_REPOSITORY:\s*([^\s\n]+)/i)?.[1] || '')
                .filter(Boolean)
            );
            let aiSlots = process.env.AI_PROVIDER_AVAILABLE === 'true' && !providerCapacityExhausted
              ? Math.max(0, maxAi - activeAi) : 0;
            let deterministicSlots = Math.max(0, 4 - activeDeterministic);

            core.info(
              'capacity ai=' + activeAi + '/' + maxAi + ' available=' + aiSlots +
              ' reason=' + capacityReason + ' success_rate=' + successRate.toFixed(3) +
              ' provider_pressure=' + providerPressure + ' repeated_failures=' + repeatedFailures +
              ' deterministic=' + activeDeterministic + '/4 available=' + deterministicSlots
            );

            const candidates = work
              .map(issue => ({
                issue,
                labels: labelsFor(issue),
                lane: laneFor(issue),
                clientRepository: String(issue.body || '').match(/CLIENT_REPOSITORY:\s*([^\s\n]+)/i)?.[1] || ''
              }))
              .filter(x => x.labels.has('factory:queued'))
              .filter(x => !x.labels.has('factory:leased') && !x.labels.has('factory:in-progress'))
              .filter(x => ![...blocked].some(label => x.labels.has(label)))
              .sort((a, b) => priority(a.labels) - priority(b.labels) || a.issue.number - b.issue.number);

            for (const item of candidates) {
              if (!item.clientRepository) {
                core.warning('#' + item.issue.number + ': missing CLIENT_REPOSITORY; scheduler will not lease.');
                continue;
              }
              if (item.lane === 'AI' && aiSlots <= 0) continue;
              if (item.lane === 'AI' && activeAiRepos.has(item.clientRepository)) {
                core.info('#' + item.issue.number + ': active AI lease already owns client ' + item.clientRepository);
                continue;
              }
              if (item.lane === 'DETERMINISTIC' && deterministicSlots <= 0) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: item.issue.number, per_page: 100
              });
              if (item.lane === 'AI') {
                const pressure = comments
                  .filter(c => c.body?.includes('<!-- nira-provider-pressure-v1 -->'))
                  .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
                const untilText = pressure?.body?.match(/NIRA_PROVIDER_COOLDOWN_UNTIL=([^\s]+)/i)?.[1] || '';
                const untilMs = Date.parse(untilText);
                if (Number.isFinite(untilMs) && Date.now() < untilMs) {
                  core.info('#' + item.issue.number + ': provider cooldown active until ' + untilText);
                  continue;
                }
              }
              const pending = comments
                .filter(c => c.body?.includes('<!-- nira-scheduler-dispatch-v1:'))
                .filter(c => c.body?.includes('NIRA_SCHEDULER_DISPATCH=PENDING'))
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (pending) {
                const markerId = pending.body.match(/<!-- nira-scheduler-dispatch-v1:(\d+) -->/)?.[1];
                const terminal = markerId && comments.some(c =>
                  c.body?.includes('<!-- nira-scheduler-dispatch-v1:' + markerId + ' -->') &&
                  /NIRA_SCHEDULER_DISPATCH=(CONSUMED|FAILED)/.test(c.body)
                );
                const ageMs = Date.now() - new Date(pending.created_at).getTime();
                if (!terminal && ageMs < 120000) {
                  core.info('#' + item.issue.number + ': pending scheduler handoff still active; skip duplicate.');
                  continue;
                }
              }

              const schedulerRun = String(context.runId);
              const marker = '<!-- nira-scheduler-dispatch-v1:' + schedulerRun + ' -->';
              await github.rest.issues.createComment({
                owner, repo, issue_number: item.issue.number,
                body: [
                  marker,
                  'NIRA_SCHEDULER_DISPATCH=PENDING',
                  'LANE=' + item.lane,
                  'PRIORITY_RANK=' + priority(item.labels),
                  'SCHEDULER_RUN_ID=' + schedulerRun
                ].join('\n')
              });
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'nira-lease.yml',
                  ref: 'main',
                  inputs: {
                    issue_number: String(item.issue.number),
                    scheduler_run_id: schedulerRun
                  }
                });
                if (item.lane === 'AI') {
                  aiSlots -= 1;
                  activeAiRepos.add(item.clientRepository);
                } else {
                  deterministicSlots -= 1;
                }
                core.notice('NIRA_SCHEDULER_DISPATCH=REQUESTED issue=' + item.issue.number + ' lane=' + item.lane);
              } catch (error) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.issue.number,
                  body: marker + '\nNIRA_SCHEDULER_DISPATCH=FAILED\nERROR=' +
                    String(error.message || error).slice(0, 500)
                });
                throw error;
              }
            }
